<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>MNEME bundle verifier</title>
<style>
:root{--g:#76b900;--bg:#0b0f0a;--p:#121810;--dim:#8fa383;--tx:#e7f0e3;--warn:#e8b33d;--bad:#c66}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 ui-monospace,monospace;padding:24px;max-width:1050px;margin:auto}
h1{color:var(--g);font-size:20px;letter-spacing:2px}
.sub{color:var(--dim);margin:8px 0 18px}
.panel{background:var(--p);border:1px solid #22301c;border-radius:8px;padding:14px;margin-bottom:12px}
h2{color:var(--g);font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.chk{padding:4px 8px;border-radius:6px;margin:4px 0;font-size:13px}
.pass{background:#0d130b;border-left:3px solid var(--g)}
.fail{background:#1c0d0d;border-left:3px solid var(--bad)}
.note{color:var(--dim);font-size:12px}
.ev{padding:3px 0 3px 14px;border-left:2px solid #22301c;font-size:12px;color:var(--dim)}
.ev b{color:var(--tx)}
.hash{color:#5a7050;font-size:11px;word-break:break-all}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;margin-left:6px;border:1px solid}
.b-ok{color:var(--g);border-color:var(--g)}
.b-no{color:var(--dim);border-color:var(--dim)}
.b-bad{color:var(--bad);border-color:var(--bad)}
.b-warn{color:var(--warn);border-color:var(--warn)}
table{width:100%;font-size:12px;border-collapse:collapse}
td{padding:4px 8px;border-bottom:1px solid #1a2414}
td:first-child{color:var(--g)}
input[type=file]{margin:10px 0;padding:8px;background:#0a0e08;border:1px dashed #2c4220;border-radius:6px;color:var(--tx);width:100%}
.big{font-size:16px;color:var(--g);font-weight:700}
.warn{color:var(--warn)}
</style></head><body>
<h1>MNEME EVIDENCE BUNDLE — offline verifier</h1>
<div class="sub">Drop a <code>.dsse.json</code> bundle. This page recomputes every seal in your
browser — nothing is trusted from the file, nothing leaves this page.</div>
<input type="file" id="f" accept=".json">
<div id="out"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=new TextEncoder();
async function sha256hex(bytes){
  const d=await crypto.subtle.digest('SHA-256',bytes);
  return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const hexToBytes=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const b64d=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));

function canonical(v){ // mneme-cjson/1.0.0: sorted keys, no whitespace
  if(v===null)return 'null';
  if(typeof v==='number')return String(v);
  if(typeof v==='boolean')return v?'true':'false';
  if(typeof v==='string')return JSON.stringify(v);
  if(Array.isArray(v))return '['+v.map(canonical).join(',')+']';
  return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canonical(v[k])).join(',')+'}';
}
const GEN='MNEME_CUSTODY_GENESIS:';
async function entryHash(mid,e,prev){
  const env={[ 'memory_id']:mid,seq:e.seq,event_type:e.event_type,
    actor_id:e.actor_id,reason:e.reason,created_at:e.created_at,
    payload:JSON.parse(e.payload_json)};
  return sha256hex(enc.encode(prev+canonical(env)));
}
async function edVerify(vkHex,sigB,msgB){
  try{
    const k=await crypto.subtle.importKey('raw',hexToBytes(vkHex),
      {name:'Ed25519'},false,['verify']);
    return await crypto.subtle.verify('Ed25519',k,sigB,msgB);
  }catch(_){return null} // browser lacks Ed25519 — degrade honestly
}

$('f').onchange=async ev=>{
  const raw=JSON.parse(await ev.target.files[0].text());
  const out=[];const log=(ok,label,detail='')=>out.push(
    `<div class="chk ${ok===null?'':ok?'pass':'fail'}">${ok===null?'◦':ok?'✓':'✗'} ${esc(label)}
     ${detail?`<span class="hash">${esc(detail)}</span>`:''}</div>`);

  // ---- DSSE envelope ----
  let b;
  if(raw.payloadType&&raw.signatures){
    const payload=b64d(raw.payload);
    const t=enc.encode(raw.payloadType);
    const pae=new Uint8Array([...enc.encode('DSSEv1 '),...enc.encode(String(t.length)),
      ...enc.encode(' '),...t,...enc.encode(' '),...enc.encode(String(payload.length)),
      ...enc.encode(' '),...payload]);
    let auth=false,kid='';
    for(const s of raw.signatures){
      kid=s.keyid||kid;
      // demo trust anchor — the bundle's own signature key is declared
      // by keyid only; verification needs the matching verify key.
      if(window.TRUSTED_KEYS&&window.TRUSTED_KEYS[s.keyid]){
        const ok=await edVerify(window.TRUSTED_KEYS[s.keyid],b64d(s.sig),pae);
        if(ok){auth=true;kid=s.keyid}
      }
    }
    log(auth,'CF-1 DSSE envelope signature',auth?`keyid ${kid}`:
        `unsigned-by-trusted-key (keyid=${kid||'none'}) — ORIGIN_UNTRUSTED`);
    b=JSON.parse(new TextDecoder().decode(payload));
  }else{b=raw;log(null,'unsigned bundle — ORIGIN_UNTRUSTED verdict path');}

  // ---- CF0 bundle digest ----
  const seal=b.bundle_sha256;delete b.bundle_sha256;
  const dig=await sha256hex(enc.encode(canonical(b)));
  log(dig===seal,'CF0 bundle digest — sha256 over canonical body',dig.slice(0,16)+'…');
  b.bundle_sha256=seal;

  const E=b.evidence,ch=E.chains,mids=Object.keys(ch);

  // ---- CF1 chains: genesis-bound, dense, hash-linked ----
  let linked=true;
  for(const mid of mids){
    let prev=await sha256hex(enc.encode(GEN+mid));
    const seqs=ch[mid].map(e=>e.seq);
    if(seqs.join()!==ch[mid].map((_,i)=>i).join())linked=false;
    for(const e of ch[mid]){
      if(e.prev_hash!==prev)linked=false;
      if(e.entry_hash!==await entryHash(mid,e,prev))linked=false;
      prev=e.entry_hash;
    }
  }
  log(linked,'CF1 every chain dense + linked + genesis-bound',`${mids.length} chains`);

  // ---- CF1.7 references resolve ----
  const seqSet={},decSet=new Set(E.decisions.map(d=>d.decision_id)),
        recSet=new Set(Object.keys(E.receipts)),midSet=new Set(mids);
  mids.forEach(m=>seqSet[m]=new Set(ch[m].map(e=>e.seq)));
  let dangling=0;
  for(const mid of mids)for(const e of ch[mid]){
    const p=JSON.parse(e.payload_json);
    for(const c of p.causes||[]){
      if(c.kind==='event'&&!(seqSet[c.memory_id]&&seqSet[c.memory_id].has(c.seq)))dangling++;
      if(c.kind==='decision'&&!decSet.has(c.id))dangling++;
      if(c.kind==='receipt'&&!recSet.has(c.id))dangling++;
    }
    const cb=p.caused_by_decision_id;
    if(cb!==undefined&&cb!==null&&!decSet.has(cb))dangling++;
  }
  for(const l of E.cell_links||[])
    if(!midSet.has(l.from_id)||!midSet.has(l.to_id))dangling++;
  for(const s of E.event_sigs||[])
    if(!(seqSet[s.memory_id]&&seqSet[s.memory_id].has(s.seq)))dangling++;
  log(dangling===0,'CF1.7 every sealed reference resolves',dangling?`${dangling} dangling`:'');

  // ---- CF1.8 attribution ----
  const keyActor={};for(const k of E.actor_keys||[]){
    (keyActor[k.actor_id]=keyActor[k.actor_id]||{})[k.keyid]=k.verify_key_hex;}
  const sigMap={};for(const s of E.event_sigs||[])sigMap[s.memory_id+'/'+s.seq]=s;
  let badSig=0,edNull=false;
  for(const mid of mids)for(const e of ch[mid]){
    const akeys=keyActor[e.actor_id];if(!akeys)continue;
    const s=sigMap[mid+'/'+e.seq];
    const vk=s&&akeys[s.keyid];
    if(!vk){badSig++;continue}
    const ok=await edVerify(vk,hexToBytes(s.sig),enc.encode(e.entry_hash));
    if(ok===null){edNull=true}else if(!ok)badSig++;
  }
  log(edNull?null:badSig===0,
      'CF1.8 keyed actors\' events carry valid signatures',
      edNull?'this browser lacks WebCrypto Ed25519 — attribution unverifiable here':
      (badSig?badSig+' bad':'attribution verified'));

  // ---- render: world + report ----
  const verdict=out.some(x=>x.includes('✗'))?'REJECTED':'VERIFIED (integrity+semantics)';
  out.push(`<div class="panel"><div class="big">${verdict}</div>
    <div class="note">${mids.length} memories · ${E.decisions.length} decisions ·
    ${Object.keys(E.receipts).length} receipts ·
    ${(E.event_sigs||[]).length} event signatures</div></div>`);

  out.push(`<div class="panel"><h2>Memories</h2><table>`+
    E.memories.map(m=>`<tr><td>${m.memory_id}</td><td>${esc(m.content.slice(0,60))}</td>
      <td>${m.custody_status}/${m.field_state}</td><td class="hash">${m.confidence}</td></tr>`).join('')+
    `</table></div>`);

  out.push(`<div class="panel"><h2>Custody chains</h2>`+
    mids.map(m=>`<div class="note" style="color:var(--g)">${m}</div>`+
      ch[m].map(e=>{
        const s=sigMap[m+'/'+e.seq];
        const badge=s?`<span class="badge b-ok">✓sig ${s.keyid}</span>`
                     :(keyActor[e.actor_id]?'<span class="badge b-bad">✗unsigned</span>'
                       :'<span class="badge b-no">no sig</span>');
        return `<div class="ev"><b>${e.event_type}</b> ${e.actor_id}
          <span class="hash">${e.reason.slice(0,44)} ${e.entry_hash.slice(0,10)}…</span>${badge}</div>`;
      }).join('')).join('')+`</div>`);

  const rep=b.report;
  out.push(`<div class="panel"><h2>Counterfactual report — do(${b.intervention.memory_id},seq${b.intervention.seq}=∅)</h2>
    <div class="note">divergent receipts: ${rep.divergent_receipts.length} ·
    ungrounded decisions: ${rep.ungrounded_decisions.length} ·
    invalidated: ${rep.invalidated.length} ·
    hypothetical: ${rep.hypothetical}</div>
    <div class="hash">report_sha256 ${rep.report_sha256}</div></div>`);

  $('out').innerHTML=out.join('');
};
</script></body></html>
